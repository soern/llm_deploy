services:
  canary-1b-v2:
    build: .
    image: canary-1b-v2:local
    container_name: canary-1b-v2
    ports:
      - "8007:8007"
    ipc: host
    environment:
      CANARY_MODEL_ID: ${CANARY_MODEL_ID:-nvidia/canary-1b-v2}
      CANARY_DEFAULT_LANG: ${CANARY_DEFAULT_LANG:-de}
      CANARY_FALLBACK_LANG: ${CANARY_FALLBACK_LANG:-en}
      # model default = float32; set to bf16 to halve VRAM (~1.9 GB weights)
      CANARY_DTYPE: ${CANARY_DTYPE:-float32}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - model-cache:/models
    # DGX Spark / GB10:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  model-cache:
